[project]
name = "prototype-rag"
version = "0.1.0"
description = "Multi-business voice/chat assistant: crawl → RAG over Postgres + pgvector → chat and phone"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "openai>=1.40",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
    "pypdf>=4.3",
    "pyyaml>=6.0",
    "numpy>=2.5.3",
    "webrtcvad-wheels>=2.0.14.post1",
    "google-cloud-speech>=2.41.0",
    "google-cloud-texttospeech>=2.38.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-playwright>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ui: browser tests of web/ pages (Playwright + Chromium, hermetic; skip with -m 'not ui')",
]
