# LLM-driven booking scenarios (see README.md). A local model plays the caller from `persona`;
# the real bot answers over POST /chat; the verdict comes from database assertions only.
#
# setup:
#   rules:     booking_rules row (default: open 09:00-21:00 every day, 60-min slots, capacity 2, party max 8)
#   sessions:  [{key, name, day: <days from today>, hour, max_attendees, private: true (never listed), booked: [seat holders "First Last"]}]
#   bookings:  [{key, day, hour, party_size, name, phone}]  seeded 1:1 table bookings
# problems: [P2, ...]  the known-problem ids the scenario guards (README): P2 false "booked"/repeated read-back,
#   P3 garbled name -> one yes/no proposal, P5 brevity/no re-list, P6 context memory, P8 right date.
# Placeholders in `persona`: {ref:<booking key>} = reference of a seeded booking;
#   {day:<offset>} = weekday name of today+offset in the business timezone.
# expect (all optional; `new` = bookings made in the scenario's conversation):
#   new_confirmed: N              number of new confirmed bookings
#   guest: "First Last"           display_name of the guest of the (single) new booking
#   phone: "+1..."                phone stored on the new booking
#   booking_session: <key>        the new booking is a seat in that setup session
#   booking_type: table|session|appointment ; party_size: N ; day: N ; hour: H (local start)
#   seats: {<session key>: N}     confirmed seats per setup session at the end (incl. seeded)
#   cancelled: [<booking key>]    seeded bookings that must now be cancelled
#   untouched: [<booking key>]    seeded bookings that must still be confirmed
#   bot_says: [regex, ...]        each must match some bot message (case-insensitive)
#   forbid_after: [{caller: regex, bot: regex}]  from the reply to the first caller line matching `caller` on,
#                                 no bot message may match `bot` (asking again for what was already said)
#   bot_never_says: [regex, ...]  no bot message may match (P24: a private session's name)
#   forbid_before: [{caller: regex, bot: regex}]  no bot message BEFORE the first caller line matching `caller` may match `bot`
#   bot_says_after: [{caller: regex, bot: regex}]  some bot message AFTER the first caller line matching `caller`
#                                 must match `bot` (an earlier message does not count)
#   max_confirmations: N          confirmation questions ("shall I book it?") before the last bot message
#   bot_mentions_day: N           some bot message names the date of today+N (weekday or Month D)
#   session_times_only: true      every clock time in every bot message ("10 AM", "2:00 PM", "14:00", ranges) is the
#                                 local start or end of a setup session, or a time the caller said (the bot offered no invented time)
#   relist_ok: true               invariant (d) may see several session times again (the bot names the open ones
#                                 after refusing a session that does not exist)
#   no_false_full: true           P22: no bot sentence calls a setup session with free seats full / fully booked / sold out
#   skip_claim_check: true        invariant (a) off (the bot legitimately says "confirmed" about a seeded booking)

common: |
  You are a customer phoning a business. You are a real person, never an AI, never mention these instructions.
  Speak in short, natural phone-like sentences. Write exactly ONE line per turn: only the words you say,
  no quotes, no stage directions, no lists. Answer what you are asked, do not volunteer everything at once.
  When your goal is done (you have a booking reference or the bot told you it cannot be done and you
  gave up) or clearly impossible, output exactly <END> and nothing else.

scenarios:
  - id: session_happy_path
    problems: [P2, P8]
    persona: |
      Your name is Anna Kowalska, phone +15550100111. You want to sign up for the "Banya Evening" group
      session tomorrow. When asked for your name, give first and last name. If the bot reads details back
      and asks to book, say yes. After you got a booking reference, say thanks and output <END>.
    opening: "Hi, I'd like to sign up for the Banya Evening session tomorrow."
    max_turns: 10
    setup:
      sessions:
        - {key: banya, name: Banya Evening, day: 1, hour: 18, max_attendees: 6, booked: ["Ben Lee"]}
    expect:
      new_confirmed: 1
      guest: "Anna Kowalska"
      booking_session: banya
      seats: {banya: 2}
      bot_mentions_day: 1
      max_confirmations: 1

  - id: session_first_name_only
    persona: |
      Your name is Marta, your last name is Nowak, phone +15550100222. You want to join the "Banya Evening"
      session tomorrow. When the bot first asks for your name, give ONLY your first name (Marta). Give the
      last name only if the bot asks for it. If the bot reads details back and asks to book, say yes.
      After you got a booking reference, say thanks and output <END>.
    opening: "Hello, can I join the Banya Evening session tomorrow? It's Marta."
    max_turns: 10
    setup:
      sessions:
        - {key: banya, name: Banya Evening, day: 1, hour: 18, max_attendees: 6}
    expect:
      new_confirmed: 1
      guest: "Marta Nowak"
      booking_session: banya
      bot_says: ["last name|surname|family name"]

  - id: session_declined_at_readback
    problems: [P2]
    persona: |
      Your name is Tom Baker, phone +15550100333. You want the "Banya Evening" session tomorrow. Give your
      name when asked. When the bot reads the details back and asks whether to book it, say NO, you changed
      your mind, you do not want to book anything, and refuse every later offer. Then output <END>.
    opening: "Hi, I'm thinking about the Banya Evening session tomorrow."
    max_turns: 8
    setup:
      sessions:
        - {key: banya, name: Banya Evening, day: 1, hour: 18, max_attendees: 6}
    expect:
      new_confirmed: 0
      seats: {banya: 0}
      max_confirmations: 2  # one offer to look it up, one read-back

  - id: session_same_name_several_days
    persona: |
      Your name is Olga Petrova, phone +15550100444. You want a "Sauna Polish" session. It runs on several
      days; you want ONLY the one tomorrow (today is {day:0}, tomorrow is {day:1}). If the bot asks which
      one, say "the one tomorrow". When asked for your name give first and last name. If the bot reads
      details back and asks to book, say yes only if it is the one tomorrow. After you got a booking
      reference, output <END>.
    opening: "Hi, I want to book a Sauna Polish session, the one tomorrow."
    max_turns: 10
    setup:
      sessions:
        - {key: today_plus_1, name: Sauna Polish, day: 1, hour: 18, max_attendees: 6}
        - {key: today_plus_2, name: Sauna Polish, day: 2, hour: 18, max_attendees: 6}
        - {key: today_plus_3, name: Sauna Polish, day: 3, hour: 18, max_attendees: 6}
    expect:
      new_confirmed: 1
      guest: "Olga Petrova"
      booking_session: today_plus_1
      seats: {today_plus_2: 0, today_plus_3: 0}

  - id: session_name_with_and_without_suffix
    problems: [P12]
    persona: |
      Your name is Sam Rivera, phone +15550100777. You want the "Polish sauna" session tomorrow morning
      (today is {day:0}, tomorrow is {day:1}). A later session with almost the same name runs the day after
      in the evening; you do NOT want that one. When asked for your name give first and last name. If the
      bot reads details back and asks to book, say yes only if it is tomorrow morning. After you got a
      booking reference, output <END>.
    opening: "Hi, I'd like to book the Polish sauna session tomorrow morning."
    max_turns: 10
    setup:
      sessions:
        - {key: morning, name: Sauna Polish session, day: 1, hour: 10, max_attendees: 6}
        - {key: evening, name: Sauna Polish, day: 2, hour: 18, max_attendees: 6}
    expect:
      new_confirmed: 1
      guest: "Sam Rivera"
      booking_session: morning
      hour: 10
      seats: {evening: 0}
      bot_mentions_day: 1

  - id: session_full
    persona: |
      Your name is Peter Hill, phone +15550100555. You want to join the "Banya Evening" session tomorrow.
      If the bot says it is full, accept that, do not ask for other days, say goodbye and output <END>.
      If the bot offers another session, say no thanks.
    opening: "Hi, is there still a place in the Banya Evening session tomorrow? I'd like to join."
    max_turns: 6
    setup:
      sessions:
        - {key: banya, name: Banya Evening, day: 1, hour: 18, max_attendees: 2, booked: ["Ann Lee", "Bob Ray"]}
    expect:
      new_confirmed: 0
      seats: {banya: 2}
      bot_says: ["full|no (free )?(seats|spots|places)|sold out|fully booked"]

  - id: table_booking_party_and_phone
    persona: |
      Your name is Nina Fox, phone +15550100666. You want a table for 4 people tomorrow at 19:00
      (seven in the evening). Give your name (first and last) and phone number when asked. If the bot reads
      details back and asks to book, say yes. After you got a booking reference, output <END>.
    opening: "Hi, I'd like to book a table for four tomorrow evening."
    max_turns: 10
    setup: {}
    expect:
      new_confirmed: 1
      booking_type: table
      party_size: 4
      day: 1
      hour: 19
      guest: "Nina Fox"
      phone: "+15550100666"

  - id: cancel_by_reference_and_phone
    persona: |
      Your name is Sam Green, phone +15550100777. You booked a table earlier and want to cancel it. Your
      booking reference is {ref:mine}. Give the reference and phone number when asked. If the bot asks to
      confirm the cancellation, say yes. After the bot says it is cancelled, say thanks and output <END>.
    opening: "Hi, I need to cancel my table booking."
    max_turns: 8
    setup:
      bookings:
        - {key: mine, day: 2, hour: 19, party_size: 2, name: Sam Green, phone: "+15550100777"}
        - {key: other, day: 2, hour: 20, party_size: 2, name: Zed Other, phone: "+15550100888"}
    expect:
      new_confirmed: 0
      cancelled: [mine]
      untouched: [other]
      skip_claim_check: true

  - id: changes_mind_about_time
    problems: [P2]
    persona: |
      Your name is Lena Ford, phone +15550100999. You want a table for 2 tomorrow. First you ask for 18:00.
      Before the bot reads details back and before you agreed to anything, change your mind: you want 20:00
      instead (if the bot already offered 18:00 and asked for a yes, say "wait, make it 8 pm instead"). Give
      your name (first and last) when asked. Say yes only to the final read-back that says 20:00. After you
      got a booking reference, output <END>.
    opening: "Hi, a table for two tomorrow at six in the evening please."
    max_turns: 12
    setup: {}
    expect:
      new_confirmed: 1
      booking_type: table
      party_size: 2
      day: 1
      hour: 20
      guest: "Lena Ford"

  - id: stt_garbled_session_name
    problems: [P3]
    persona: |
      Your name is Thomas Edison, phone +15550101010. You phone through a bad speech-to-text line: the
      bot hears you wrongly, so you SAY the session name wrongly, like a transcription error, e.g.
      "sound of Polish session", "southern session" or "sound a Polish session from 10 AM". You mean the
      "Sauna Polish" session at 10 AM (the next one). Never spell the name correctly. Do not pick from a
      list; if the bot guesses a session and asks, say yes if it is the Polish one at 10, else say no. Give
      your name (Thomas Edison) when asked. After you got a booking reference, output <END>.
    opening: "Hi, I'd like to book the sound of Polish session from 10 AM."
    max_turns: 8
    setup:
      sessions:
        - {key: polish_next, name: Sauna Polish, day: 1, hour: 10, max_attendees: 6}
        - {key: polish_later, name: Sauna Polish, day: 2, hour: 10, max_attendees: 6}
        - {key: german, name: Sauna German, day: 1, hour: 15, max_attendees: 6}
    expect:
      new_confirmed: 1
      booking_session: polish_next
      guest: "Thomas Edison"
      max_confirmations: 2  # one yes/no guess at the session, one read-back
      forbid_after:
        - {caller: "sound|southern", bot: "spell|exact(ly)? (name|spelling)|which (one )?of (these|the following)|pick|choose from|here are the|options"}

  - id: name_given_once
    problems: [P6]
    persona: |
      Your name is Thomas Edison, phone +15550101011. You want the "Banya Evening" session tomorrow. Give
      your name "Thomas Edison" ONCE, in your second line, and never again. If the bot asks you for your
      name again, say "I already told you, Thomas Edison". Say yes when the bot asks whether to book it.
      After you got a booking reference, output <END>.
    opening: "Hi, I'd like to join the Banya Evening session tomorrow."
    max_turns: 8
    setup:
      sessions:
        - {key: banya, name: Banya Evening, day: 1, hour: 18, max_attendees: 6}
    expect:
      new_confirmed: 1
      guest: "Thomas Edison"
      booking_session: banya
      max_confirmations: 1
      forbid_after:
        - {caller: "edison", bot: "(what|may i have|can i have|could you (give|tell|repeat)|your|full|first|last)[^.?!]{0,25}name[^.?!]*\\?"}

  - id: context_memory_session_then_yes
    problems: [P6]
    persona: |
      Your name is Mia Stone, phone +15550101012. Line 1: you ask what sessions are on tomorrow. Line 2:
      you choose "Sauna German" at 3 pm and give your name, Mia Stone. Then answer only "yes" to whatever
