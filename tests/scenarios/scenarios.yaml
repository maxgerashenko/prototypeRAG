      got a booking reference, output <END>.
    opening: "Hi, what sessions do you have tomorrow?"
    max_turns: 8
    setup:
      sessions:
        - {key: polish, name: Sauna Polish, day: 1, hour: 10, max_attendees: 6}
        - {key: german, name: Sauna German, day: 1, hour: 15, max_attendees: 6}
    expect:
      new_confirmed: 1
      guest: "Mia Stone"
      booking_session: german
      max_confirmations: 1
      forbid_after:
        - {caller: "german", bot: "which (session|one|class)|what (session|date|day)|which (date|day)|(your|full|first|last) name\\?"}
        - {caller: "mia", bot: "(what|may i have|can i have|could you (give|tell|repeat))[^.?!]{0,25}name[^.?!]*\\?"}

  - id: brevity_no_relist
    problems: [P5]
    persona: |
      Your name is Kate Moss, phone +15550101013. Line 1: you ask what is on tomorrow. When the bot answers,
      choose "Sauna German" and give your name, Kate Moss, in one line. Then answer only "yes" to
      confirmation questions. After you got a booking reference, output <END>.
    opening: "Hello, what's on tomorrow?"
    max_turns: 8
