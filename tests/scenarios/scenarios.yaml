      sessions:
        - {key: polish, name: Sauna Polish, day: 1, hour: 10, max_attendees: 6}
        - {key: german, name: Sauna German, day: 1, hour: 15, max_attendees: 6}
        - {key: banya, name: Banya Evening, day: 1, hour: 18, max_attendees: 6}
    expect:
      new_confirmed: 1
      booking_session: german
      guest: "Kate Moss"
      max_confirmations: 1
      forbid_after:
        - {caller: "german", bot: "polish|banya"}

