  - id: nonexistent_session_not_offered
    from: 0f303aa9
    problems: [P13, P16, P19]
    persona: |
      Your name is Dana Reyes, phone +15550101555. First ask what is on tomorrow. Then ask "any other
      sessions tomorrow?". Then say you would like to book "the Steam Bath session at 2 PM". If the bot
      tells you there is no such session and names others, say no thanks, you do not want those, and
      output <END>. If it asks you to confirm anything, say yes.
    opening: "Hi, what sessions do you have tomorrow?"
    max_turns: 8
    setup:
      sessions:
        - {key: polish, name: Sauna Polish, day: 1, hour: 10, max_attendees: 8}
        - {key: german, name: Sauna German, day: 1, hour: 15, max_attendees: 8}
        - {key: banya, name: Banya Evening, day: 1, hour: 18, max_attendees: 8}
    expect:
      new_confirmed: 0
      session_times_only: true
      relist_ok: true
      bot_says_after:  # the refusal must come after the caller asked for it (an earlier "no other sessions" does not count)
        - caller: "steam"
          bot: "not (on|in) (the|our) (schedule|list)|no such|there(.s| is| isn.t| are| is not) no |there isn.t (a|an|any)|(don.t|do not|cannot|can.t) (have|see|find|confirm)|isn.t (a|an|on|available|scheduled|listed|in)|not available|not (one of|among|there|listed|scheduled)"
        - caller: "steam"  # and it names the real sessions (the refusal sentence is built in code)
          bot: "Polish|German|Banya"
      forbid_after:
        - caller: "steam"
          bot: "steam[^.?!]*(shall i book|book it)|(shall i book|book it)[^.?!]*steam|steam[^.?!]*seats"
        - caller: "steam"  # an affirmative answer (the caller's own "2 PM" is allowed in a refusal, so check the words)
          bot: "\\byes\\b[^.?!]*steam|steam[^.?!]*(is available|is open|we have|is on the schedule|can book)"

